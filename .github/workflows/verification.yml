name: Verification foundation

on:
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: core acceptance (incomplete baseline blocks)
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Node for infrastructure tests only
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verify infrastructure guards (not core acceptance)
        run: node --test tests/verificationPlan.test.ts tests/dependencyPreparation.test.ts tests/sdkTypesPreparation.test.ts tests/providerResolution.test.ts
      - name: Prepare exact Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.3.14'
      - name: Prepare pinned original SDK configuration types only
        run: node scripts/prepareSdkTypes.ts
      - name: Prepare frozen dependencies without lifecycle scripts
        run: node scripts/prepareDependencies.ts
      # No SDK programs or installer fallback. Type resources do not verify desktop runtime.
      - name: Run complete candidate gate without substituting bootstrap success
        env:
          verificationBase: ${{ github.event.pull_request.base.sha || github.sha }}
          verificationHead: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          bun scripts/verify.ts --profile core --base $env:verificationBase --head $env:verificationHead
          exit $LASTEXITCODE
